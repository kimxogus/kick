<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제품 상세 — 킥(Kick)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav" data-active="products"></div>

  <main class="container py-5" id="detail-root">
    <!-- JS로 채워짐 -->
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../data/products.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // main.js의 buildNav/Footer는 ../ 경로 보정이 필요하므로 상세 페이지는 자체 렌더
      const navEl = document.getElementById("nav");
      navEl.outerHTML = `
      <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
        <div class="container">
          <a class="navbar-brand fs-3" href="../index.html">킥 Kick</a>
          <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto gap-2">
              <li class="nav-item"><a class="nav-link" href="../index.html">홈</a></li>
              <li class="nav-item"><a class="nav-link" href="../week.html">위클리보드</a></li>
              <li class="nav-item"><a class="nav-link active text-kick fw-bold" href="../products.html">탐색</a></li>
              <li class="nav-item"><a class="nav-link" href="../contest.html">콘테스트</a></li>
            </ul>
          </div>
        </div>
      </nav>`;

      const footerEl = document.getElementById("footer");
      footerEl.outerHTML = `
      <footer class="py-4 mt-5 text-center text-muted small">
        <div class="container">
          <p class="mb-0">킥(Kick) — agent에게 말 한마디로 내 제품을 런칭하는 플랫폼 (데모)</p>
        </div>
      </footer>`;

      const id = new URLSearchParams(window.location.search).get("id");
      const product = KICK_PRODUCTS.find((p) => p.id === id) || KICK_PRODUCTS[0];
      render(product);
    });

    function render(product) {
      document.title = `${product.name} — 킥(Kick)`;
      const count = getLikeCount(product);
      const liked = getLikedSet().has(product.id);

      const cardNewsHtml = product.cardNews
        .map((text) => `<div class="col-md-4 mb-3"><div class="cardnews-slide">${text}</div></div>`)
        .join("");

      const targetHtml = product.targetMessages
        .map(
          (t) => `
        <div class="col-md-6 mb-3">
          <div class="p-3 border rounded h-100">
            <div class="badge bg-light text-dark border mb-2">${t.audience}</div>
            <p class="mb-0">${t.message}</p>
          </div>
        </div>`
        )
        .join("");

      const commentsHtml = product.comments.length
        ? product.comments
            .map(
              (c) => `
          <div class="border-bottom py-2">
            <strong>${c.author}</strong>
            <p class="mb-0 text-muted small">${c.text}</p>
          </div>`
            )
            .join("")
        : `<p class="text-muted small">아직 댓글이 없습니다. 첫 댓글을 남겨보세요!</p>`;

      document.getElementById("detail-root").innerHTML = `
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
          <div class="d-flex align-items-center gap-3">
            <span class="product-emoji" style="font-size:3.5rem">${product.emoji}</span>
            <div>
              <span class="badge bg-light text-dark border mb-2">${product.category}</span>
              <h1 class="h2 fw-bold mb-1">${product.name}</h1>
              <p class="text-muted mb-0">${product.tagline}</p>
            </div>
          </div>
          <div class="text-end">
            <button class="like-btn ${liked ? "liked" : ""}" id="like-btn">
              ❤️ <span class="like-count">${count}</span>
            </button>
            <div class="mt-2">
              <a href="${product.website}" target="_blank" class="btn btn-sm btn-outline-dark">웹사이트 방문</a>
            </div>
          </div>
        </div>

        <div class="alert" style="background:#fff3ee; border:1px solid #ffd9c8;">
          <strong class="text-kick">Kick Point</strong> — ${product.kickPoint}
        </div>

        <section class="mb-5">
          <h2 class="h5 fw-bold mb-3">카드뉴스</h2>
          <div class="row">${cardNewsHtml}</div>
        </section>

        <section class="mb-5">
          <h2 class="h5 fw-bold mb-3">상세 소개</h2>
          <p>${product.description}</p>
          <div class="d-flex flex-wrap gap-2 mt-3">
            ${product.tags.map((t) => `<span class="badge bg-light text-dark border">#${t}</span>`).join("")}
          </div>
        </section>

        <section class="mb-5">
          <h2 class="h5 fw-bold mb-3">타겟별 홍보 메시지</h2>
          <div class="row">${targetHtml}</div>
        </section>

        <section class="mb-5">
          <h2 class="h5 fw-bold mb-3">댓글</h2>
          <div class="mb-3">${commentsHtml}</div>
          <form class="d-flex gap-2" onsubmit="event.preventDefault(); alert('데모: 댓글 작성은 추후 연결됩니다.');">
            <input type="text" class="form-control" placeholder="댓글을 남겨보세요">
            <button class="btn btn-kick" type="submit">등록</button>
          </form>
        </section>

        <div class="text-muted small">등록일: ${product.launchDate}</div>
      `;

      document.getElementById("like-btn").addEventListener("click", (e) => {
        const btn = e.currentTarget;
        toggleLike(product.id, btn, btn.querySelector(".like-count"));
      });
    }
  </script>
</body>
</html>
