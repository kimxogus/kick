<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위클리보드 — 킥(Kick)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav" data-active="week"></div>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
      <div>
        <h1 class="h3 fw-bold mb-1">위클리보드</h1>
        <p class="text-muted mb-0">이번 주 (2026-06-08 ~ 2026-06-14) 런칭된 제품에 좋아요를 눌러보세요.</p>
      </div>
      <div class="text-muted small">← 지난주 | 다음주 → (데모 미연결)</div>
    </div>

    <div class="row">
      <!-- 날짜별 제품 리스트 -->
      <div class="col-lg-8">
        <h2 class="h5 fw-bold mb-3">날짜별 런칭</h2>
        <div id="daily-list"></div>
      </div>

      <!-- 주간 랭킹 -->
      <div class="col-lg-4">
        <h2 class="h5 fw-bold mb-3">주간 랭킹 🏆</h2>
        <div class="list-group" id="ranking-list"></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data/products.js"></script>
  <script src="js/main.js"></script>
  <script>
    function dailyItem(product) {
      const count = getLikeCount(product);
      const liked = getLikedSet().has(product.id);
      return `
      <div class="card mb-3 shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <span class="product-emoji">${product.emoji}</span>
          <div class="flex-grow-1">
            <a href="product/index.html?id=${product.id}" class="text-decoration-none text-dark">
              <h3 class="h6 fw-bold mb-1">${product.name}</h3>
            </a>
            <p class="text-muted small mb-1">${product.tagline}</p>
            <span class="badge bg-light text-dark border">${product.category}</span>
          </div>
          <div class="text-center">
            <button class="like-btn ${liked ? "liked" : ""}" data-id="${product.id}">
              ❤️ <span class="like-count">${count}</span>
            </button>
            <div class="text-muted small mt-1">${product.launchDate}</div>
          </div>
        </div>
      </div>`;
    }

    function rankingItem(product, rank) {
      const count = getLikeCount(product);
      return `
      <a href="product/index.html?id=${product.id}" class="list-group-item list-group-item-action d-flex align-items-center gap-3">
        <span class="rank-badge">${rank}</span>
        <span class="product-emoji" style="font-size:1.5rem">${product.emoji}</span>
        <div class="flex-grow-1">
          <div class="fw-bold">${product.name}</div>
          <div class="text-muted small">${product.tagline}</div>
        </div>
        <span class="text-muted small">❤️ ${count}</span>
      </a>`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      // 날짜별 그룹핑
      const byDate = {};
      KICK_PRODUCTS.forEach((p) => {
        byDate[p.launchDate] = byDate[p.launchDate] || [];
        byDate[p.launchDate].push(p);
      });
      const dates = Object.keys(byDate).sort().reverse();

      const dailyEl = document.getElementById("daily-list");
      dailyEl.innerHTML = dates
        .map((date) => {
          const header = `<h3 class="h6 text-muted mt-4 mb-2">${date}</h3>`;
          const items = byDate[date].map(dailyItem).join("");
          return header + items;
        })
        .join("");

      // 좋아요 버튼 이벤트
      dailyEl.querySelectorAll(".like-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const countEl = btn.querySelector(".like-count");
          toggleLike(btn.dataset.id, btn, countEl);
          renderRanking();
        });
      });

      renderRanking();
    });

    function renderRanking() {
      const ranked = sortedByLikes(KICK_PRODUCTS);
      const el = document.getElementById("ranking-list");
      el.innerHTML = ranked.map((p, i) => rankingItem(p, i + 1)).join("");
    }
  </script>
</body>
</html>
