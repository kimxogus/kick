<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제품 탐색 — 킥(Kick)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav" data-active="products"></div>

  <main class="container py-5">
    <h1 class="h3 fw-bold mb-1">제품 탐색</h1>
    <p class="text-muted mb-4">킥에 등록된 모든 제품은 동일한 품질로 정리됩니다.</p>

    <div class="row mb-4 g-2 align-items-center">
      <div class="col-md-5">
        <input type="text" id="search-input" class="form-control" placeholder="제품명, 한 줄 소개, 태그로 검색">
      </div>
      <div class="col-md-4">
        <select id="category-filter" class="form-select">
          <option value="">전체 카테고리</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="sort-select" class="form-select">
          <option value="latest">최신순</option>
          <option value="likes">좋아요순</option>
        </select>
      </div>
    </div>

    <div id="result-count" class="text-muted small mb-3"></div>
    <div class="row" id="product-grid"></div>
    <div id="empty-state" class="text-center text-muted py-5 d-none">검색 결과가 없습니다.</div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data/products.js"></script>
  <script src="js/main.js"></script>
  <script>
    function applyFilters() {
      const q = document.getElementById("search-input").value.trim().toLowerCase();
      const category = document.getElementById("category-filter").value;
      const sort = document.getElementById("sort-select").value;

      let result = KICK_PRODUCTS.filter((p) => {
        const matchesQuery =
          !q ||
          p.name.toLowerCase().includes(q) ||
          p.tagline.toLowerCase().includes(q) ||
          p.tags.some((t) => t.toLowerCase().includes(q));
        const matchesCategory = !category || p.category === category;
        return matchesQuery && matchesCategory;
      });

      result = sort === "likes" ? sortedByLikes(result) : [...result].sort((a, b) => (a.launchDate < b.launchDate ? 1 : -1));

      document.getElementById("result-count").textContent = `${result.length}개의 제품`;
      document.getElementById("empty-state").classList.toggle("d-none", result.length > 0);
      renderProductGrid("product-grid", result);
    }

    document.addEventListener("DOMContentLoaded", () => {
      // 카테고리 옵션 채우기
      const categories = [...new Set(KICK_PRODUCTS.map((p) => p.category))];
      const select = document.getElementById("category-filter");
      categories.forEach((c) => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });

      ["search-input", "category-filter", "sort-select"].forEach((id) => {
        document.getElementById(id).addEventListener("input", applyFilters);
      });

      applyFilters();
    });
  </script>
</body>
</html>
