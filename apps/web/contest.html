<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘테스트 — 킥(Kick)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav" data-active="contest"></div>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-start flex-wrap mb-4">
      <div>
        <h1 class="h3 fw-bold mb-1">콘테스트</h1>
        <p class="text-muted mb-0">누구나 콘테스트를 개최하고 상금을 걸 수 있습니다. (상금 표시만, 결제 미연동)</p>
      </div>
      <button class="btn btn-kick" data-bs-toggle="modal" data-bs-target="#hostModal">콘테스트 개최하기</button>
    </div>

    <div class="row" id="contest-list"></div>
  </main>

  <!-- 개최하기 안내 모달 -->
  <div class="modal fade" id="hostModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">콘테스트 개최 (데모)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>콘테스트 개최, 상금 등록, 마감일 기준 자동 등록 기능은 곧 제공될 예정입니다.</p>
          <p class="text-muted small mb-0">현재는 기능 존재를 보여주는 데모 화면입니다.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-kick" data-bs-dismiss="modal">확인</button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data/products.js"></script>
  <script src="js/main.js"></script>
  <script>
    function contestCard(c) {
      const statusClass = c.status === "진행중" ? "contest-status-ongoing" : "contest-status-closed";
      return `
      <div class="col-12 col-md-6 mb-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <span class="badge ${statusClass}">${c.status}</span>
              <span class="text-muted small">마감 ${c.deadline}</span>
            </div>
            <h2 class="h5 fw-bold mb-1">${c.title}</h2>
            <p class="text-muted small mb-2">주최: ${c.host}</p>
            <p class="mb-1"><strong>${c.prize}</strong></p>
            <p class="text-muted small mb-0">참가 제품 ${c.productCount}개</p>
          </div>
        </div>
      </div>`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("contest-list").innerHTML = KICK_CONTESTS.map(contestCard).join("");
    });
  </script>
</body>
</html>
